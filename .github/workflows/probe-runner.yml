# MANUAL runner compatibility probe. Records facts; claims nothing it did not measure.
# Free target needs no approval. Self-hosted and paid targets are gated by Environments (required reviewers).
name: probe-runner
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which runner to probe
        type: choice
        required: true
        default: github-hosted-free
        options:
          - github-hosted-free
          - self-hosted
          - paid-larger-16core
permissions:
  contents: read
concurrency:
  group: probe-runner
  cancel-in-progress: false
jobs:
  probe-free:
    if: inputs.target == 'github-hosted-free'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/probe
        with:
          artifact_name: probe-github-hosted-free

  probe-selfhosted:
    if: inputs.target == 'self-hosted'
    runs-on: [self-hosted, linux, x64, almus-builder]
    environment: self-hosted-runners
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/probe
        with:
          artifact_name: probe-self-hosted

  probe-paid:
    if: inputs.target == 'paid-larger-16core'
    runs-on: almus-linux-16c
    environment: paid-runners
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/probe
        with:
          artifact_name: probe-paid-16core
