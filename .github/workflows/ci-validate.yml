# FREE CI: standard GitHub-hosted runner only. Runs on PRs and pushes to main.
# Never references a paid or self-hosted runner (enforced by scripts/ci/check-workflow-policy.py).
name: ci-validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install lint tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck libxml2-utils python3-yaml
      - name: Actions pinned to full SHAs
        run: bash scripts/ci/check-pins.sh
      - name: Workflow cost/security policy
        run: python3 scripts/ci/check-workflow-policy.py
      - name: shellcheck
        run: find scripts testing tools -name '*.sh' -print0 | xargs -0 -r shellcheck -x
      - name: bash syntax
        run: find scripts testing tools -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Manifests well-formed
        run: find build -name '*.xml' -o -name '*.xml.template' | xargs -r -n1 xmllint --noout
      - name: Secret and forbidden-file tripwire
        run: bash scripts/ci/scan-secrets.sh
